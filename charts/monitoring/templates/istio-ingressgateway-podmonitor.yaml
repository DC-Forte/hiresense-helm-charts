apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-ingressgateway
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - istio-system
  selector:
    matchLabels:
      istio: ingressgateway
  podMetricsEndpoints:
    - port: http-envoy-prom
      path: /stats/prometheus
      interval: 30s
      # Request/response size histograms: ~6k series, no dashboard or alert uses them.
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: istio_(request|response)_bytes_bucket
          action: drop
