          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 19 },
          "targets": [{
            "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=~\"recruiter-report-.*\",container!=\"\",container!=\"POD\"}[2m])) by (namespace, pod)",
            "legendFormat": "{{ "{{" }}namespace{{ "}}" }}/{{ "{{" }}pod{{ "}}" }}",
            "datasource": { "type": "prometheus" }
          }],
          "fieldConfig": { "defaults": { "unit": "cores" } }
