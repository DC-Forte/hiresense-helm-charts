            "legendFormat": "{{ "{{" }}namespace{{ "}}" }}/{{ "{{" }}pod{{ "}}" }}",
            "datasource": { "type": "prometheus" }
          }],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "id": 13,
          "type": "row",
          "title": "Logs",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 27 }
        },
        {
          "id": 14,
          "title": "Service Logs",
          "type": "logs",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 28 },
          "options": { "dedupStrategy": "none", "showLabels": true, "showTime": true, "wrapLogMessage": true },
          "targets": [{
            "expr": "{namespace=~\"recruiter-report-.*\", app=\"recruiter-report\"} | json",
            "datasource": { "type": "loki" }
          }]
        }
