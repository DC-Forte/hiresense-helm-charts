apiVersion: v1
kind: ConfigMap
metadata:
  name: hiresense-app-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "HireSense"
data:
  hiresense-app.json: |
    {
      "title": "HireSense App",
      "uid": "hiresense-app",
      "description": "Monolith (hiresense-app / hiresense-app-prod) — staging + prod on one dashboard, split by namespace",
      "schemaVersion": 38,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "HTTP — Backend",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
        },
        {
          "id": 2,
          "title": "Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 1 },
          "targets": [{
            "expr": "sum(rate(http_server_request_duration_seconds_count{namespace=\"$environment\",job=~\"hiresense-backend.*\"}[2m])) by (namespace, http_route, http_request_method)",
            "legendFormat": "{{ "{{" }}namespace{{ "}}" }} {{ "{{" }}http_request_method{{ "}}" }} {{ "{{" }}http_route{{ "}}" }}",
            "datasource": { "type": "prometheus" }
          }],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 3,
          "title": "Latency p50 / p95 / p99 (ms)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 1 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_server_request_duration_seconds_bucket{namespace=\"$environment\",job=~\"hiresense-backend.*\"}[2m])) by (le, namespace)) * 1000",
              "legendFormat": "p50 {{ "{{" }}namespace{{ "}}" }}",
              "datasource": { "type": "prometheus" }
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket{namespace=\"$environment\",job=~\"hiresense-backend.*\"}[2m])) by (le, namespace)) * 1000",
              "legendFormat": "p95 {{ "{{" }}namespace{{ "}}" }}",
              "datasource": { "type": "prometheus" }
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_request_duration_seconds_bucket{namespace=\"$environment\",job=~\"hiresense-backend.*\"}[2m])) by (le, namespace)) * 1000",
              "legendFormat": "p99 {{ "{{" }}namespace{{ "}}" }}",
              "datasource": { "type": "prometheus" }
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ms" } }
        },
        {
          "id": 4,
          "title": "Error Rate (5xx %)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 1 },
          "targets": [{
            "expr": "100 * sum(rate(http_server_request_duration_seconds_count{namespace=\"$environment\",job=~\"hiresense-backend.*\",http_response_status_code=~\"5..\"}[2m])) by (namespace) / sum(rate(http_server_request_duration_seconds_count{namespace=\"$environment\",job=~\"hiresense-backend.*\"}[2m])) by (namespace)",
            "legendFormat": "{{ "{{" }}namespace{{ "}}" }} error %",
            "datasource": { "type": "prometheus" }
          }],
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0 } }
        },
        {
          "id": 5,
          "type": "row",
          "title": "Worker",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 }
        },
        {
          "id": 6,
          "title": "Worker Goroutines",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 10 },
          "targets": [{
            "expr": "go_goroutines{namespace=\"$environment\",job=~\"hiresense-worker.*\"}",
            "legendFormat": "{{ "{{" }}namespace{{ "}}" }} {{ "{{" }}pod{{ "}}" }}",
            "datasource": { "type": "prometheus" }
          }],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 7,
          "title": "Worker Heap Memory",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 10 },
          "targets": [{
            "expr": "go_memstats_heap_inuse_bytes{namespace=\"$environment\",job=~\"hiresense-worker.*\"}",
            "legendFormat": "{{ "{{" }}namespace{{ "}}" }} {{ "{{" }}pod{{ "}}" }}",
            "datasource": { "type": "prometheus" }
          }],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "id": 8,
          "title": "Worker GC Pause Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 10 },
          "targets": [{
            "expr": "sum(rate(go_gc_duration_seconds_sum{namespace=\"$environment\",job=~\"hiresense-worker.*\"}[2m])) by (namespace)",
            "legendFormat": "{{ "{{" }}namespace{{ "}}" }}",
            "datasource": { "type": "prometheus" }
          }],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 9,
          "type": "row",
          "title": "Pod Health",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 18 }
        },
        {
          "id": 10,
          "title": "Pod Restarts",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 19 },
          "targets": [{
            "expr": "increase(kube_pod_container_status_restarts_total{namespace=\"$environment\"}[15m])",
            "legendFormat": "{{ "{{" }}namespace{{ "}}" }}/{{ "{{" }}pod{{ "}}" }}",
            "datasource": { "type": "prometheus" }
          }],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 11,
          "title": "Container CPU Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 19 },
          "targets": [{
            "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"$environment\",container!=\"\",container!=\"POD\"}[2m])) by (namespace, pod)",
            "legendFormat": "{{ "{{" }}namespace{{ "}}" }}/{{ "{{" }}pod{{ "}}" }}",
            "datasource": { "type": "prometheus" }
          }],
          "fieldConfig": { "defaults": { "unit": "cores" } }
        },
        {
          "id": 12,
          "type": "row",
          "title": "Logs",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 27 }
        },
        {
          "id": 13,
          "title": "Backend Logs",
          "type": "logs",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 28 },
          "options": { "dedupStrategy": "none", "showLabels": true, "showTime": true, "wrapLogMessage": true },
          "targets": [{
            "expr": "{namespace=\"$environment\", app=\"hiresense-backend\"} | json",
            "datasource": { "type": "loki" }
          }]
        },
        {
          "id": 14,
          "type": "row",
          "title": "Traces",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 38 }
        },
        {
          "id": 15,
          "title": "Backend Traces ($environment)",
          "type": "traces",
          "description": "Filtered by deployment.environment.name — requires the telemetry fix shipped 2026-09-12 (commit c799df7) to be deployed; older traces predate this tag and won't show here.",
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 39 },
          "targets": [{
            "query": "{resource.service.name=~\"interview-backend.*\" && resource.deployment.environment.name=\"${environment:text}\"}",
            "queryType": "traceql",
            "datasource": { "type": "tempo" }
          }]
        }
      ],
      "templating": {
        "list": [
          {
            "name": "environment",
            "type": "custom",
            "label": "Environment",
            "query": "staging : hiresense-app, production : hiresense-app-prod",
            "current": { "text": "staging", "value": "hiresense-app" },
            "options": [
              { "text": "staging", "value": "hiresense-app", "selected": true },
              { "text": "production", "value": "hiresense-app-prod", "selected": false }
            ],
            "multi": false,
            "includeAll": false,
            "hide": 0
          }
        ]
      }
    }
---
