            "datasource": { "type": "prometheus" }
          }],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 3,
          "title": "Latency p50 / p95 / p99 (ms)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 1 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(recruiterreport_request_duration_seconds_bucket{namespace=~\"recruiter-report-.*\"}[2m])) by (le, namespace)) * 1000",
              "legendFormat": "p50 {{ "{{" }}namespace{{ "}}" }}",
              "datasource": { "type": "prometheus" }
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(recruiterreport_request_duration_seconds_bucket{namespace=~\"recruiter-report-.*\"}[2m])) by (le, namespace)) * 1000",
              "legendFormat": "p95 {{ "{{" }}namespace{{ "}}" }}",
              "datasource": { "type": "prometheus" }
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(recruiterreport_request_duration_seconds_bucket{namespace=~\"recruiter-report-.*\"}[2m])) by (le, namespace)) * 1000",
              "legendFormat": "p99 {{ "{{" }}namespace{{ "}}" }}",
              "datasource": { "type": "prometheus" }
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ms" } }
        },
        {
          "id": 4,
          "title": "Enqueue Errors (rate/min)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 1 },
          "targets": [{
            "expr": "sum(rate(recruiterreport_request_errors_total{namespace=~\"recruiter-report-.*\"}[5m])) by (namespace) * 60",
            "legendFormat": "{{ "{{" }}namespace{{ "}}" }}",
            "datasource": { "type": "prometheus" }
          }],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 5,
          "type": "row",
          "title": "Runtime (Go)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 }
        },
        {
          "id": 6,
          "title": "Goroutines",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 10 },
          "targets": [{
            "expr": "go_goroutines{namespace=~\"recruiter-report-.*\"}",
            "legendFormat": "{{ "{{" }}namespace{{ "}}" }} {{ "{{" }}pod{{ "}}" }}",
            "datasource": { "type": "prometheus" }
          }],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 7,
          "title": "Heap Memory In-Use",
          "type": "timeseries",
