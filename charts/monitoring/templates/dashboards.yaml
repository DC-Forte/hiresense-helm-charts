            "expr": "go_memstats_heap_inuse_bytes{namespace=~\"recruiter-report-.*\"}",
            "legendFormat": "{{ "{{" }}namespace{{ "}}" }} {{ "{{" }}pod{{ "}}" }}",
            "datasource": { "type": "prometheus" }
          }],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "id": 8,
          "title": "GC Pause Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 10 },
          "targets": [{
            "expr": "sum(rate(go_gc_duration_seconds_sum{namespace=~\"recruiter-report-.*\"}[2m])) by (namespace)",
            "legendFormat": "{{ "{{" }}namespace{{ "}}" }}",
            "datasource": { "type": "prometheus" }
          }],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 9,
