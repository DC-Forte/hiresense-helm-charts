apiVersion: v2
name: hiresense-monitoring
description: Observability stack — Prometheus, Grafana, Loki, Tempo, Promtail, Pyroscope
type: application
version: 0.1.0

# Pin chart versions. Update with:
#   helm search repo prometheus-community/kube-prometheus-stack
#   helm search repo grafana/loki
#   helm search repo grafana/tempo
#   helm search repo grafana/promtail
#   helm search repo grafana/pyroscope
dependencies:
  - name: kube-prometheus-stack
    version: "87.18.0"
    repository: https://prometheus-community.github.io/helm-charts

  - name: loki
    version: "7.1.0"
    repository: https://grafana.github.io/helm-charts

  - name: tempo
    version: "1.24.4"
    repository: https://grafana.github.io/helm-charts

  - name: promtail
    version: "6.17.1"
    repository: https://grafana.github.io/helm-charts

  - name: pyroscope
    version: "2.1.2"
    repository: https://grafana.github.io/helm-charts

  - name: metrics-server
    version: "3.13.1"
    repository: https://kubernetes-sigs.github.io/metrics-server/
