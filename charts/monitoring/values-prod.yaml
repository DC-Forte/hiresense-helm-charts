# Production overrides for hiresense-monitoring.
# Non-secret. Secrets (Grafana admin password, Spaces keys) go in values-prod.secrets.yaml.
#
# Requires two pre-created DigitalOcean Spaces buckets:
#   doctl spaces create hiresense-loki   --region fra1
#   doctl spaces create hiresense-tempo  --region fra1
#
# Install:
#   helm upgrade --install monitoring ./charts/monitoring -n monitoring \
#     -f charts/monitoring/values-prod.yaml \
#     -f charts/monitoring/values-prod.secrets.yaml

# ─────────────────────────────────────────────────────────────────────────────
# Prometheus + Grafana
# ─────────────────────────────────────────────────────────────────────────────
kube-prometheus-stack:

  prometheus:
    prometheusSpec:
      retention: 30d
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: do-block-storage
            resources:
              requests:
                storage: 20Gi
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 2
          memory: 4Gi

  grafana:
    # adminPassword injected via values-prod.secrets.yaml

    persistence:
      storageClassName: do-block-storage

    service:
      type: ClusterIP

    grafana.ini:
      server:
        root_url: "https://grafana.dc-forte.com/"
        domain: grafana.dc-forte.com

    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1
        memory: 1Gi

# ─────────────────────────────────────────────────────────────────────────────
# Loki — production: DigitalOcean Spaces (S3-compatible) backend
# ─────────────────────────────────────────────────────────────────────────────
loki:
  loki:
    storage:
      type: s3
      use_thanos_objstore: true  # chunks storage below; legacy aws.S3Config dropped the `prefix` field in Loki 3.x
      bucketNames:
        chunks: hiresense
        ruler: hiresense
        admin: hiresense
      s3:
        # Legacy client — still used for ruler/admin API storage, which have no thanos_objstore support.
        # No prefix here: ruler/admin write to bucket root now (ruler unused in this deployment).
        endpoint: fra1.digitaloceanspaces.com
        region: fra1
        # Credentials injected via values-prod.secrets.yaml
        accessKeyId: ""
        secretAccessKey: ""
        s3ForcePathStyle: true   # required for DO Spaces
        insecure: false

      object_store:
        # Thanos-based client for chunks storage — the only path that still supports a bucket prefix,
        # letting loki and tempo/ share the "hiresense" bucket.
        # storage_prefix only allows [a-zA-Z0-9-], no slash (unlike the legacy `prefix` field).
        type: s3
        storage_prefix: loki
        s3:
          endpoint: fra1.digitaloceanspaces.com
          region: fra1
          bucket_lookup_type: path   # thanos equivalent of s3ForcePathStyle, required for DO Spaces
          # Credentials injected via values-prod.secrets.yaml
          access_key_id: ""
          secret_access_key: ""
          insecure: false

    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    limits_config:
      retention_period: 48h  # default: 2 days; retention_stream (base values.yaml) keeps services at 7d

    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: s3

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      storageClass: do-block-storage
      size: 5Gi   # WAL only; chunks go to Spaces
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 2Gi

# ─────────────────────────────────────────────────────────────────────────────
# Tempo — production: DigitalOcean Spaces (S3-compatible) backend
# ─────────────────────────────────────────────────────────────────────────────
tempo:
  tempo:
    retention: 168h   # 7 days in prod

    storage:
      trace:
        backend: s3
        s3:
          bucket: hiresense
          endpoint: fra1.digitaloceanspaces.com
          region: fra1
          prefix: tempo/
          # Credentials injected via values-prod.secrets.yaml
          access_key: ""
          secret_key: ""
          forcepathstyle: true  # required for DO Spaces
          insecure: false
        wal:
          path: /var/tempo/wal

  persistence:
    enabled: true
    storageClassName: do-block-storage
    size: 5Gi   # WAL only; blocks go to Spaces

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi

# ─────────────────────────────────────────────────────────────────────────────
# Promtail
# ─────────────────────────────────────────────────────────────────────────────
promtail:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi
  config:
    snippets:
      pipelineStages:
        - cri: {}
        - json:
            expressions:
              path: path
        - drop:
            source: path
            expression: "^(/metrics|/health|/api/health|/api/v1/health)$"
        - match:
            selector: '{app="hiresense-ai-engine"}'
            stages:
              - drop:
                  expression: '.*"GET (/health|/api/v1/health|/api/health|/metrics) HTTP/1\.1" 200.*'
        - match:
            selector: '{app="hiresense-backend"}'
            stages:
              - json:
                  expressions:
                    msg: msg
              - drop:
                  source: msg
                  expression: "^livekit keep-alive.*$"
        - match:
            selector: '{app="pyroscope"}'
            stages:
              - logfmt:
                  mapping:
                    level:
              - regex:
                  expression: '^\S+ \[(?P<level>\w+)\]'
              - drop:
                  source: level
                  expression: "(?i)^(debug|info)$"
        - match:
            selector: '{app="tempo"}'
            stages:
              - logfmt:
                  mapping:
                    level:
              - drop:
                  source: level
                  expression: "^(debug|info)$"
        - match:
            selector: '{app="cpc-bridge-proxy"}'
            stages:
              - drop:
                  expression: '^(127\.0\.0\.1 - - \[.*\] "GET /healthz HTTP/1\.1" 200|\S+ \[.*\] TCP 200 )'
        - match:
            selector: '{app="csi-do-node"}'
            stages:
              - logfmt:
                  mapping:
                    level:
              - drop:
                  source: level
                  expression: "^info$"
        - match:
            selector: '{app="cilium-agent", container="arp-fix"}'
            stages:
              - drop:
                  expression: '^\S+ reachable$'
        - match:
            selector: '{app="coredns"}'
            stages:
              - drop:
                  expression: '^\[WARNING\] No files matching import glob pattern: custom/\*\.(server|override)$'
        - match:
            selector: '{app="doks-otel"}'
            stages:
              - drop:
                  expression: '^(done\.|config is in sync, skipping\.|trying to ref.*sh token\.\.\.)$'
        - match:
            selector: '{app="loki", container="loki"}'
            stages:
              - logfmt:
                  mapping:
                    level:
              - drop:
                  source: level
                  expression: "(?i)^(debug|info)$"
        - match:
            selector: '{app="loki", container="loki-sc-rules"}'
            stages:
              - json:
                  expressions:
                    level:
              - drop:
                  source: level
                  expression: "(?i)^(debug|info)$"

# ─────────────────────────────────────────────────────────────────────────────
# Grafana Istio ingress
# ─────────────────────────────────────────────────────────────────────────────
grafana:
  istio:
    enabled: true
    host: "grafana.dc-forte.com"
    ingressSelector:
      istio: ingressgateway
    tls:
      enabled: true
      secretName: "hiresense-tls"
    # Fix HTTP/2 coalescing: grafana shares hiresense-tls cert + IP, so Chrome
    # reuses the hiresense connection. Attaching to both gateways ensures Istio
    # routes the request regardless of which SNI the connection was opened with.
    hiresenseGateway: "hiresense-app/hiresense-gateway"
