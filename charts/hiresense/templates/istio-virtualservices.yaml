{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: hiresense-candidate
  namespace: {{ .Values.global.namespace }}
  labels: {{- include "hiresense.labels" . | nindent 4 }}
spec:
  hosts:
    - {{ .Values.hosts.candidate | quote }}
  gateways:
    - {{ .Values.istio.gateway }}
  http:
    - route:
        - destination:
            host: hiresense-frontend-candidate.{{ .Values.global.namespace }}.svc.cluster.local
            port:
              number: 80
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: hiresense-recruiter
  namespace: {{ .Values.global.namespace }}
  labels: {{- include "hiresense.labels" . | nindent 4 }}
spec:
  hosts:
    - {{ .Values.hosts.recruiter | quote }}
  gateways:
    - {{ .Values.istio.gateway }}
  http:
    - route:
        - destination:
            host: hiresense-frontend-recruiter.{{ .Values.global.namespace }}.svc.cluster.local
            port:
              number: 80
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: hiresense-api
  namespace: {{ .Values.global.namespace }}
  labels: {{- include "hiresense.labels" . | nindent 4 }}
spec:
  hosts:
    - {{ .Values.hosts.api | quote }}
  gateways:
    - {{ .Values.istio.gateway }}
  http:
    - match:
        - uri:
            prefix: /ws
      route:
        - destination:
            host: hiresense-backend.{{ .Values.global.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.backend.port }}
    # Sub-phase 3a-ii cutover: candidate practice flow repointed to the standalone
    # interviewhandoff service. Route-at-a-time flip, per
    # chapter-interview-backend-go's docs/superpowers/plans/2026-08-28-interviewhandoff-practice-flow.md —
    # verified live in interviewhandoff-staging before this rule was added. Prefix must match
    # the FE's real path (/candidate-api/v1/practice, see candidateApiBase.ts) — a bare
    # /v1/practice match never receives real traffic since the FE always sends the
    # /candidate-api prefix; caught 2026-08-28 via response-header diffing after an
    # initial verification curl tested the wrong path.
    - match:
        - uri:
            prefix: /candidate-api/v1/practice
      route:
        - destination:
            host: interviewhandoff.interviewhandoff-staging.svc.cluster.local
            port:
              number: 80
      timeout: 120s
    # Sub-phase 3b cutover: candidate invite/guest-accept flow repointed to
    # interviewhandoff. Verified live in interviewhandoff-staging (port-forward,
    # bypassing Istio) before this rule was added — same full-path-match lesson
    # as the practice rule above.
    - match:
        - uri:
            prefix: /candidate-api/v1/invite
      route:
        - destination:
            host: interviewhandoff.interviewhandoff-staging.svc.cluster.local
            port:
              number: 80
      timeout: 120s
    # Sub-phase 3d cutover: real interview execution (getInterview,
    # start/end, device-check, feedback, invite-token fallback) repointed to
    # interviewhandoff. Verified live in interviewhandoff-staging
    # (port-forward, bypassing Istio) before this rule was added — same
    # full-path-match lesson as the practice/invite rules above. Monolith's
    # own copy of these six handlers stays dual-served, not deleted.
    - match:
        - uri:
            prefix: /candidate-api/v1/interviews
      route:
        - destination:
            host: interviewhandoff.interviewhandoff-staging.svc.cluster.local
            port:
              number: 80
      timeout: 120s
    # Phase 4 cutover: voice-agent message/completion ingestion repointed to
    # interviewhandoff. New path, not a reuse of the monolith's existing
    # /api/livekit-interview mount -- Istio routes by path, not by request
    # content, so old in-flight rooms (whose metadata still points at the
    # monolith) and new rooms (pointing here) need genuinely distinct paths.
    # See chapter-interview-backend-go's
    # docs/superpowers/specs/2026-08-30-interviewhandoff-livekit-ingest-design.md.
    - match:
        - uri:
            prefix: /api/interviewhandoff/livekit-interview
      route:
        - destination:
            host: interviewhandoff.interviewhandoff-staging.svc.cluster.local
            port:
              number: 80
      timeout: 120s
    # Phase 6 cutover: session-token chunked-recording-upload routes
    # repointed to interviewhandoff. Same path as the monolith's own
    # /api/recording/* mount (browser-called, full-path cutover — same
    # precedent as the practice/invite/interviews rules above), NOT a new
    # distinct path like Phase 4's voice-agent rule needed. Verify live in
    # interviewhandoff-staging (port-forward, bypassing Istio) before this
    # rule is applied. See chapter-interview-backend-go's
    # docs/superpowers/specs/2026-08-31-interviewhandoff-recording-pipeline-design.md.
    - match:
        - uri:
            prefix: /api/recording
      route:
        - destination:
            host: interviewhandoff.interviewhandoff-staging.svc.cluster.local
            port:
              number: 80
      timeout: 120s
    # Sub-project 2: Mobius no-signup candidate handoff. Both routes are new
    # paths that never existed anywhere before, so this is a straightforward
    # new-block addition (not a same-path cutover like the practice/invite/
    # interviews/recording rules above). interviewhandoff has no Gateway of
    # its own — this VirtualService's already-public hiresense-api host is
    # what makes these two paths externally reachable by Mobius. See
    # chapter-interview-backend-go's
    # docs/superpowers/specs/2026-08-31-mobius-hiresense-handoff-v2-design.md.
    - match:
        - uri:
            prefix: /handoff
        - uri:
            prefix: /internal/handoff
      route:
        - destination:
            host: interviewhandoff.interviewhandoff-staging.svc.cluster.local
            port:
              number: 80
      timeout: 120s
    - route:
        - destination:
            host: hiresense-backend.{{ .Values.global.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.backend.port }}
      timeout: 120s
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: hiresense-ai
  namespace: {{ .Values.global.namespace }}
  labels: {{- include "hiresense.labels" . | nindent 4 }}
spec:
  hosts:
    - {{ .Values.hosts.ai | quote }}
  gateways:
    - {{ .Values.istio.gateway }}
  http:
    - route:
        - destination:
            host: hiresense-ai-engine.{{ .Values.global.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.aiEngine.port }}
      timeout: 120s
{{- end }}
