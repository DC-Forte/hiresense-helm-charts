# Prod overrides. Pair with values-prod.secrets.yaml (gitignored).
# New real prod environment (2026-09-11 buildout, see
# docs/superpowers/specs/2026-09-11-hiresense-staging-prod-buildout-design.md).
global:
  namespace: matchengine-prod

image:
  tag: prod

replicas: 1

env:
  # PROD PIN: prod images predate OPENAI_MODEL_EFFORT (and the Python model-family fix), so Luna on
  # them would run at the slow default effort or fail. Remove this line when the prod images
  # are promoted and staging is tested (docs: chapter-interview-backend-go staging-remove-gpt4 plan).
  OPENAI_MODEL: "gpt-4.1"
  APP_ENV: production # base values.yaml defaults to staging
