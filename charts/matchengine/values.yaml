# Default values for the matchengine chart. Base values here are
# environment-agnostic; values-staging.yaml overrides the per-env bits
# (namespace, replicas). Secrets are never here — see
# values-staging.secrets.example.yaml.
#
# This chart is deliberately standalone, not a subchart of ../hiresense —
# same pattern as ../interviewhandoff and ../recruiter-report: own
# namespace, own release. Same k8s cluster is reused.
#
# ClusterIP-only, no public ingress/TLS/Istio Gateway — every caller today
# (the monolith's internal/service/matchblend + internal/service/rubricservice
# HTTP clients, and later interviewhandoff) is in-cluster. Unlike
# recruiter-report, nothing external calls this service.
#
# Only values-staging.yaml exists — hiresense and its extracted services
# have exactly one real environment today, and dc-forte-db-postgresql-fra1-65749
# (the DB this chart points at) is that staging DB, not prod — no prod DB
# has been created yet. Add values-prod.yaml once a real prod environment
# for hiresense exists.

global:
  namespace: matchengine-staging # overridden per env
  registry: ghcr.io/dc-forte
  imagePullPolicy: Always
  imagePullSecret: ghcr-pull

image:
  repository: chapter-interview-go-matchengine
  # placeholder — ghcr never publishes "latest" for this image (see build-matchengine.yml).
  # values-staging.yaml overrides with the real env tag; --set image.tag=<sha> to pin.
  tag: latest

replicas: 1
port: 8091
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Non-secret env. Secrets are below in `secrets:`, populated via
# values-staging.secrets.yaml (gitignored).
env:
  APP_ENV: staging
  PORT: "8091"
  DB_PORT: "25061"
  DB_SSL_MODE: require
  OPENAI_MODEL: "gpt-4.1"

# All values below are placeholders. Real values come from
# values-staging.secrets.yaml (gitignored).
secrets:
  internalServiceToken: "" # shared secret the monolith's + interviewhandoff's HTTP clients send as X-Internal-Token
  dbHost: ""
  dbName: "" # hiresense — same shared instance/DB as the monolith and interviewhandoff, own schema
  dbUser: ""
  dbPassword: ""
  encryptionKey: "" # AES key for decrypting resumes/job_descriptions — must match the monolith's/interviewhandoff's ENCRYPTION_KEY, same encrypted columns
  openaiApiKey: ""
  azureOpenaiApiKey: ""
  azureOpenaiEndpoint: ""
  azureOpenaiDeploymentName: ""
  azureOpenaiApiVersion: ""

# Reuses the cluster's existing monitoring stack (same cluster as hiresense) —
# no new Prometheus/Grafana/Loki/Tempo install needed.
monitoring:
  serviceMonitor:
    # Metrics landed 2026-08-29 (promhttp.Handler() on /metrics).
    enabled: true
    labels: {}
