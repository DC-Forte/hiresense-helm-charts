apiVersion: apps/v1
kind: Deployment
metadata:
  name: interviewhandoff
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "interviewhandoff.labels" . | nindent 4 }}
    app: interviewhandoff
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: interviewhandoff
  template:
    metadata:
      labels:
        app: interviewhandoff
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecret }}
      containers:
        - name: interviewhandoff
          image: {{ include "interviewhandoff.image" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: interviewhandoff-env
            - secretRef:
                name: interviewhandoff-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
