apiVersion: v1
kind: Secret
metadata:
  name: interviewhandoff-secrets
  namespace: {{ .Values.global.namespace }}
  labels: {{- include "interviewhandoff.labels" . | nindent 4 }}
type: Opaque
stringData:
  INTERNAL_SERVICE_TOKEN: {{ required "secrets.internalServiceToken is required" .Values.secrets.internalServiceToken | quote }}
  LIVEKIT_URL: {{ required "secrets.liveKitUrl is required" .Values.secrets.liveKitUrl | quote }}
  LIVEKIT_API_KEY: {{ required "secrets.liveKitApiKey is required" .Values.secrets.liveKitApiKey | quote }}
  LIVEKIT_API_SECRET: {{ required "secrets.liveKitApiSecret is required" .Values.secrets.liveKitApiSecret | quote }}
  CANDIDATE_JWT_SECRET: {{ required "secrets.candidateJwtSecret is required" .Values.secrets.candidateJwtSecret | quote }}
  DB_HOST: {{ required "secrets.dbHost is required" .Values.secrets.dbHost | quote }}
  DB_NAME: {{ required "secrets.dbName is required" .Values.secrets.dbName | quote }}
  DB_USER: {{ required "secrets.dbUser is required" .Values.secrets.dbUser | quote }}
  DB_PASSWORD: {{ required "secrets.dbPassword is required" .Values.secrets.dbPassword | quote }}
  ENCRYPTION_KEY: {{ required "secrets.encryptionKey is required" .Values.secrets.encryptionKey | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  AZURE_OPENAI_API_KEY: {{ .Values.secrets.azureOpenaiApiKey | quote }}
  AZURE_OPENAI_ENDPOINT: {{ .Values.secrets.azureOpenaiEndpoint | quote }}
  AZURE_OPENAI_DEPLOYMENT_NAME: {{ .Values.secrets.azureOpenaiDeploymentName | quote }}
  AZURE_OPENAI_API_VERSION: {{ .Values.secrets.azureOpenaiApiVersion | quote }}
  MATCHENGINE_INTERNAL_TOKEN: {{ .Values.secrets.matchEngineInternalToken | quote }}
  S3_BUCKET: {{ .Values.secrets.s3Bucket | quote }}
  AWS_REGION: {{ .Values.secrets.s3Region | quote }}
  S3_ENDPOINT: {{ .Values.secrets.s3Endpoint | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.awsSecretAccessKey | quote }}
  RECORDING_S3_BUCKET: {{ .Values.secrets.recordingS3Bucket | quote }}
  MOBIUS_INTERNAL_TOKEN: {{ .Values.secrets.mobiusInternalToken | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
