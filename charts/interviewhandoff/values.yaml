# Default values for the interviewhandoff chart. Base values here are
# environment-agnostic; values-staging.yaml / values-prod.yaml override the
# per-env bits (namespace, host, replicas). Secrets are never here — see
# values-staging.secrets.example.yaml / values-prod.secrets.example.yaml.
#
# This chart is deliberately standalone, not a subchart of ../hiresense —
# same pattern as ../recruiter-report: own namespace, own release. Same k8s
# cluster is reused, nothing here references the hiresense chart's resources.
#
# Two real environments: staging (shared Postgres instance with the monolith)
# and prod (live since the 2026-09-11/12 buildout, own dedicated Postgres
# cluster) — both overlays below are live, not scaffolding.
#
# Sub-phases 3-0 through 3a-ii (see chapter-interview-backend-go's
# docs/superpowers/specs/2026-08-2{7,8}-*.md) added a real DB (own schema +
# cross-schema reads of the monolith's users/jobs/prompts), Redis, an LLM
# client, and a matchengine HTTP client on top of Phase 0+1's LiveKit-only
# scope — all wired below.
#
# No OWN public ingress/TLS/Istio Gateway in this chart — sub-project 2
# (Mobius handoff: POST /internal/handoff, GET /handoff/{token}) piggybacks
# on the hiresense chart's already-public hiresense-api VirtualService
# instead (charts/hiresense/templates/istio-virtualservices.yaml), same
# mechanism the recording routes use. See chapter-interview-backend-go's
# docs/superpowers/specs/2026-08-31-mobius-hiresense-handoff-v2-design.md.

global:
  namespace: interviewhandoff-prod # overridden per env
  registry: ghcr.io/dc-forte
  imagePullPolicy: Always
  imagePullSecret: ghcr-pull

image:
  repository: chapter-interview-go-interviewhandoff
  # placeholder — ghcr never publishes "latest" for this image (see build-interviewhandoff.yml).
  # values-staging.yaml/values-prod.yaml override with the real env tag; --set image.tag=<sha> to pin.
  tag: latest

replicas: 1
port: 8090
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Phase 6: recording merge worker, a separate binary/Deployment in this same
# chart (own image, shares interviewhandoff-env/interviewhandoff-secrets —
# same pattern as the hiresense chart's own worker.* block).
worker:
  enabled: true
  image:
    repository: chapter-interview-go-interviewhandoffworker
    tag: latest # values-{staging,prod}.yaml override with the real env tag
  replicas: 1
  metricsPort: 9091
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

# Non-secret env. Secrets are below in `secrets:`, populated via
# values-{env}.secrets.yaml (gitignored).
env:
  APP_ENV: production
  PORT: "8090"
  DB_PORT: "25061"
  DB_POOL_MAX: "10"
  DB_POOL_MIN: "1"
  DB_SSL_MODE: require
  LIVEKIT_AGENT_NAME: "dc-forte-voice-agent" # must match the monolith's own LIVEKIT_AGENT_NAME
  CANDIDATE_AUTH_V2: "true"
  ALLOW_INTERVIEW_WITHOUT_AGENT: "false"
  AGENTIC_API_URL: "https://hiresense-ai.dc-forte.com" # chapter-interview-backend-python (hiresense-ai-engine), reached via the hiresense-ai VirtualService -- fixed 2026-09-16, the old hiresense-api/api/agentic value had no matching Istio route (fell through to the monolith catch-all, 404 "Route not found" on every resume PDF parse, see resume_data_shape_mismatch memory)
  LLM_TIMEOUT_SECONDS: "60"
  OPENAI_MODEL: "gpt-4.1" # shared by the report pipeline, matchengine etc. -- do NOT point this at a reasoning model; template generation has its own TEMPLATE_MODEL below
  TEMPLATE_BACKEND: "python" # where per-job interview templates are generated: "python" (hiresense-ai-engine via AGENTIC_API_URL) or "go" (interviewhandoff enqueues, interviewhandoffworker generates). One ConfigMap feeds both Deployments, so they always agree. Flip to "go" per env in values-{staging,prod}.yaml; before prod, confirm the interview_template_* rows exist in that env's prompts table (seeded by the Go migration) and the parity eval was reviewed (chapter-interview-backend-go tools/templateeval)
  TEMPLATE_MODEL: "gpt-6-luna" # model used only for template generation when TEMPLATE_BACKEND=go (reasoning model: the Go client drops temperature/seed for it). Empty = OPENAI_MODEL
  TEMPLATE_MODEL_EFFORT: "medium" # reasoning_effort for TEMPLATE_MODEL (none|low|medium|high|...); empty = API default (medium for gpt-6-luna)
  INTERVIEW_FEEDBACK_MODEL: "" # model for the v5 interview feedback report (interviewhandoffworker only); empty = OPENAI_MODEL. Reasoning models work, e.g. "gpt-6-luna"
  INTERVIEW_FEEDBACK_MODEL_EFFORT: "" # reasoning_effort for INTERVIEW_FEEDBACK_MODEL: none|low|medium|high|...; empty = API default; ignored by ordinary models
  MATCHENGINE_URL: "" # set once matchengine is deployed, e.g. http://matchengine.matchengine-staging.svc.cluster.local
  CANDIDATE_FRONTEND_URL: "https://hiresense.dc-forte.com" # CORS allowlist — must match the monolith's own CANDIDATE_FRONTEND_URL
  CANDIDATE_PORTAL_URL: "https://hiresense.dc-forte.com" # base URL for invite links sent by email — must match the monolith's own CANDIDATE_PORTAL_URL, else invites default to stale https://app.chapterapps.ai
  ALLOWED_ORIGINS: "" # CORS override for the embedded-handoff flow (POST /handoff/{token}/open + /candidate-api/v1/interviews/* called cross-origin from a partner's own frontend). Empty = getAllowedOrigins falls back to CANDIDATE_FRONTEND_URL/CANDIDATE_PORTAL_URL + localhost dev origins only, which does NOT include any partner origin. When a partner (e.g. Mobius) embeds, set this to the FULL comma-separated allowlist — it REPLACES the fallback rather than adding to it, so include CANDIDATE_FRONTEND_URL/CANDIDATE_PORTAL_URL's values here too, e.g. "https://hiresense.dc-forte.com,https://app.mobius.example.com"
  PUBLIC_API_BASE_URL: "https://hiresense-api.dc-forte.com" # public host both interviewhandoff and the monolith share — used to build the backend_api_url room-metadata value the voice agent calls back to
  RECORDING_STORAGE_PROVIDER: "minio" # cosmetic — feeds the /api/recording/status response only
  RECORDING_CHUNK_DURATION_SECONDS: "5" # cosmetic — feeds the /api/recording/status response only
  MOBIUS_WEBHOOK_URL: "" # empty on purpose — set per env in values-{staging,prod}.yaml (each points at its own Mobius core-api); empty disables the sender (see cmd/interviewhandoffworker/main.go)
  OTLP_ENDPOINT: "" # host:port for the OTLP HTTP trace exporter (Tempo), e.g. tempo.monitoring.svc.cluster.local:4318 — empty disables tracing, same convention as charts/hiresense's monitoring.otlpEndpoint. Set per-env below; this binary never exported any traces before this was wired.
  MOBIUS_WEBHOOK_POLL_INTERVAL_SECONDS: "30"
  MOBIUS_FRONTEND_ORIGIN: "" # exact scheme+host Mobius embeds @incproctor/proctoring-sdk from -- set once Mobius hands it over (see chapter-interview-backend-go's docs/mobius-integration.md, incProc SDK section). Empty = ensureProctoringSession falls back to CANDIDATE_FRONTEND_URL, which is wrong for Mobius but fails soft (incProc's own origin check rejects the mint)
  FEEDBACK_WORKER_POLL_INTERVAL_SECONDS: "30" # read by interviewhandoffworker's new feedback.Worker instance
  FEEDBACK_WORKER_BATCH_SIZE: "5"
  FEEDBACK_WORKER_MAX_RETRIES: "5"
  PYTHON_BACKEND_URL: "http://hiresense-ai-engine.hiresense-app.svc.cluster.local:9091/api/v1" # in-cluster AI engine, same value the monolith's own cmd/worker uses for feedback generation -- NOT AGENTIC_API_URL (that's a different, public-facing endpoint used only for /api/v2/templates/status)
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USER: "engage@dc-forte.com"
  EMAIL_FROM: "contact@dc-forte.com"

# All values below are placeholders. Real values come from
# values-{env}.secrets.yaml (gitignored).
secrets:
  internalServiceToken: "" # shared secret the monolith's HTTP clients send as X-Internal-Token
  liveKitUrl: ""
  liveKitApiKey: ""
  liveKitApiSecret: ""
  candidateJwtSecret: "" # must match the monolith's own CANDIDATE_JWT_SECRET — verifies the same tokens
  dbHost: ""
  dbName: "" # hiresense — same instance as the monolith and matchengine (shared staging instance / dedicated prod cluster), own schema
  dbUser: ""
  dbPassword: ""
  encryptionKey: "" # AES key for decrypting resumes/job_descriptions/users — must match the monolith's ENCRYPTION_KEY, same encrypted columns
  redisUrl: "" # promptservice's cache layer — can reuse the monolith's own Redis instance
  openaiApiKey: ""
  azureOpenaiApiKey: ""
  azureOpenaiEndpoint: ""
  azureOpenaiDeploymentName: ""
  azureOpenaiApiVersion: ""
  matchEngineInternalToken: "" # must match matchengine's own secrets.internalServiceToken
  s3Bucket: "" # DO Spaces bucket for recording uploads — reuse hiresense chart's secrets.spaces.bucket value ("hiresense"), NOT a new bucket, so the monolith's recording-merge worker can read what candidates upload here
  s3Region: "" # e.g. fra1
  s3Endpoint: "" # e.g. https://fra1.digitaloceanspaces.com
  awsAccessKeyId: "" # reuse hiresense chart's secrets.spaces.accessKey
  awsSecretAccessKey: "" # reuse hiresense chart's secrets.spaces.secretKey
  recordingS3Bucket: "" # usually same as s3Bucket
  mobiusInternalToken: "" # shared secret with Mobius specifically — deliberately separate from internalServiceToken (that one's shared by first-party internal services; Mobius is an external trust boundary)
  incProcInternalToken: "" # shared secret with incProc (proctoring vendor) — recording-playback route only, same external-trust-boundary reasoning as mobiusInternalToken above
  # Outbound integration (session mint, video analyze submit/results,
  # credits) — distinct from incProcInternalToken above, which stays wired
  # for the old inbound pull-model route only. See docs/incproc-hld.md.
  # incProc issues two separate key pairs: SDK for browser-session mint
  # (opening sessions), API for video-analyze/results/credits — one pair
  # doesn't authenticate the other's endpoints.
  incProcBaseURL: ""
  incProcSDKKey: ""
  incProcSDKSecret: ""
  incProcAPIKey: ""
  incProcAPISecret: ""
  incProcWebhookSecret: ""
  smtpPassword: "" # only the password is sensitive — host/port/user/from live in env: above

# Reuses the cluster's existing monitoring stack (same cluster as hiresense) —
# no new Prometheus/Grafana/Loki/Tempo install needed.
monitoring:
  serviceMonitor:
    # Metrics landed 2026-08-29 (promhttp.Handler() on /metrics).
    enabled: true
    labels: {}
