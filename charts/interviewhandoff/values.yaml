# Default values for the interviewhandoff chart. Base values here are
# environment-agnostic; values-staging.yaml / values-prod.yaml override the
# per-env bits (namespace, host, replicas). Secrets are never here — see
# values-staging.secrets.example.yaml / values-prod.secrets.example.yaml.
#
# This chart is deliberately standalone, not a subchart of ../hiresense —
# same pattern as ../recruiter-report: own namespace, own release. Same k8s
# cluster is reused, nothing here references the hiresense chart's resources.
#
# Only values-staging.yaml is real right now — hiresense and its extracted
# services have exactly one real environment today, and that's staging; no
# prod DB/environment exists yet. values-prod.yaml is scaffolding for later.
#
# Sub-phases 3-0 through 3a-ii (see chapter-interview-backend-go's
# docs/superpowers/specs/2026-08-2{7,8}-*.md) added a real DB (own schema +
# cross-schema reads of the monolith's users/jobs/prompts), Redis, an LLM
# client, and a matchengine HTTP client on top of Phase 0+1's LiveKit-only
# scope — all wired below.
#
# No public ingress/TLS/Istio Gateway, unlike recruiter-report — every
# caller today (the monolith's HTTP clients, plus candidates via Istio
# route flips once cut over) is in-cluster/behind the existing gateway, so
# this is ClusterIP-only. recruiter-report needs a public host because
# Mobius calls it from outside the cluster; interviewhandoff gets that
# treatment only when sub-project 2 (Mobius handoff) actually ships an
# external-facing endpoint — not yet designed, don't build for it.

global:
  namespace: interviewhandoff-prod # overridden per env
  registry: ghcr.io/dc-forte
  imagePullPolicy: Always
  imagePullSecret: ghcr-pull

image:
  repository: chapter-interview-go-interviewhandoff
  # placeholder — ghcr never publishes "latest" for this image (see build-interviewhandoff.yml).
  # values-staging.yaml/values-prod.yaml override with the real env tag; --set image.tag=<sha> to pin.
  tag: latest

replicas: 1
port: 8090
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Phase 6: recording merge worker, a separate binary/Deployment in this same
# chart (own image, shares interviewhandoff-env/interviewhandoff-secrets —
# same pattern as the hiresense chart's own worker.* block).
worker:
  enabled: true
  image:
    repository: chapter-interview-go-interviewhandoffworker
    tag: latest # values-staging.yaml overrides with the real env tag
  replicas: 1
  metricsPort: 9091
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

# Non-secret env. Secrets are below in `secrets:`, populated via
# values-{env}.secrets.yaml (gitignored).
env:
  APP_ENV: production
  PORT: "8090"
  DB_PORT: "25060"
  DB_SSL_MODE: require
  LIVEKIT_AGENT_NAME: "dc-forte-voice-agent" # must match the monolith's own LIVEKIT_AGENT_NAME
  CANDIDATE_AUTH_V2: "true"
  ALLOW_INTERVIEW_WITHOUT_AGENT: "false"
  AGENTIC_API_URL: "https://hiresense-api.dc-forte.com/api/agentic" # chapter-interview-backend-python, same base URL the monolith's own AGENTIC_API_URL uses
  LLM_TIMEOUT_SECONDS: "60"
  OPENAI_MODEL: "gpt-4.1"
  MATCHENGINE_URL: "" # set once matchengine is deployed, e.g. http://matchengine.matchengine-staging.svc.cluster.local
  CANDIDATE_FRONTEND_URL: "https://hiresense.dc-forte.com" # CORS allowlist — must match the monolith's own CANDIDATE_FRONTEND_URL
  PUBLIC_API_BASE_URL: "https://hiresense-api.dc-forte.com" # public host both interviewhandoff and the monolith share — used to build the backend_api_url room-metadata value the voice agent calls back to
  RECORDING_STORAGE_PROVIDER: "minio" # cosmetic — feeds the /api/recording/status response only
  RECORDING_CHUNK_DURATION_SECONDS: "5" # cosmetic — feeds the /api/recording/status response only
  RECORDING_WORKER_POLL_INTERVAL_SECONDS: "60" # read by the interviewhandoffworker Deployment; harmless no-op env var on the HTTP Deployment

# All values below are placeholders. Real values come from
# values-{env}.secrets.yaml (gitignored).
secrets:
  internalServiceToken: "" # shared secret the monolith's HTTP clients send as X-Internal-Token
  liveKitUrl: ""
  liveKitApiKey: ""
  liveKitApiSecret: ""
  candidateJwtSecret: "" # must match the monolith's own CANDIDATE_JWT_SECRET — verifies the same tokens
  dbHost: ""
  dbName: "" # hiresense — same shared instance as the monolith and matchengine, own schema
  dbUser: ""
  dbPassword: ""
  encryptionKey: "" # AES key for decrypting resumes/job_descriptions/users — must match the monolith's ENCRYPTION_KEY, same encrypted columns
  redisUrl: "" # promptservice's cache layer — can reuse the monolith's own Redis instance
  openaiApiKey: ""
  azureOpenaiApiKey: ""
  azureOpenaiEndpoint: ""
  azureOpenaiDeploymentName: ""
  azureOpenaiApiVersion: ""
  matchEngineInternalToken: "" # must match matchengine's own secrets.internalServiceToken
  s3Bucket: "" # DO Spaces bucket for recording uploads — reuse hiresense chart's secrets.spaces.bucket value ("hiresense"), NOT a new bucket, so the monolith's recording-merge worker can read what candidates upload here
  s3Region: "" # e.g. fra1
  s3Endpoint: "" # e.g. https://fra1.digitaloceanspaces.com
  awsAccessKeyId: "" # reuse hiresense chart's secrets.spaces.accessKey
  awsSecretAccessKey: "" # reuse hiresense chart's secrets.spaces.secretKey
  recordingS3Bucket: "" # usually same as s3Bucket

# Reuses the cluster's existing monitoring stack (same cluster as hiresense) —
# no new Prometheus/Grafana/Loki/Tempo install needed.
monitoring:
  serviceMonitor:
    # Metrics landed 2026-08-29 (promhttp.Handler() on /metrics).
    enabled: true
    labels: {}
