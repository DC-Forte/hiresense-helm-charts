apiVersion: apps/v1
kind: Deployment
metadata:
  name: recruiter-report
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "recruiter-report.labels" . | nindent 4 }}
    app: recruiter-report
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: recruiter-report
  template:
    metadata:
      labels:
        app: recruiter-report
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecret }}
      containers:
        - name: recruiter-report
          image: {{ include "recruiter-report.image" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: recruiter-report-env
            - secretRef:
                name: recruiter-report-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
