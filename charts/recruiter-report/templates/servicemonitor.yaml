{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: recruiter-report
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "recruiter-report.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app: recruiter-report
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
{{- end }}
