{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: {{ .Values.istio.gateway }}
  namespace: {{ .Values.global.namespace }}
  labels: {{- include "recruiter-report.labels" . | nindent 4 }}
spec:
  selector:
    {{- toYaml .Values.istio.ingressSelector | nindent 4 }}
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - {{ .Values.host | quote }}
      # No httpsRedirect here (unlike hiresense's chart) — that's a blanket
      # listener-level setting with no path exceptions, and it breaks
      # cert-manager's own HTTP-01 self-check (which requests plain HTTP and
      # gets redirected into a TLS handshake with no valid cert yet —
      # "connection reset by peer"). hiresense's chart gets away with it only
      # because manageCertManager: false there — its cert was adopted, not
      # issued through this same HTTP-01 flow. HTTPS enforcement for real
      # traffic happens at the VirtualService level instead (see
      # istio-virtualservice.yaml), which can exclude the challenge path.
    {{- if .Values.tls.enabled }}
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - {{ .Values.host | quote }}
      tls:
        mode: SIMPLE
        credentialName: {{ .Values.tls.secretName }}
    {{- end }}
{{- end }}
