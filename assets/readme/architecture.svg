<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="460" viewBox="0 0 1200 460"
     role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Telemetry flow from HireSense workloads into the monitoring chart</title>
  <desc id="arch-desc">The Go backend + worker (charts/hiresense) and the standalone recruiter-report service (charts/recruiter-report, staging + prod) both send metrics to Prometheus, structured logs via Promtail to Loki, OTLP traces to Tempo, and continuous profiles to Pyroscope. All four are queried from one Grafana instance, with a direct trace-to-profile link between Tempo and Pyroscope.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="#4A5057"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="#FF6B35"/>
    </marker>
  </defs>

  <rect width="1200" height="460" rx="26" fill="#0B0D0F"/>
  <rect x="1" y="1" width="1198" height="458" rx="25" fill="none" stroke="#1E2226" stroke-width="1"/>

  <text x="56" y="46" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" letter-spacing="1.6" fill="#6B7280">SIGNAL FLOW · charts/hiresense + charts/recruiter-report → charts/monitoring</text>

  <!-- Connector fan: workloads -> stores -->
  <g stroke="#4A5057" stroke-width="1.25" fill="none">
    <path d="M296 230 C 375 230, 375 89, 470 89"   marker-end="url(#arrow)"/>
    <path d="M296 230 C 375 230, 375 183, 470 183"  marker-end="url(#arrow)"/>
    <path d="M296 230 C 375 230, 375 277, 470 277"  marker-end="url(#arrow)"/>
    <path d="M296 230 C 375 230, 375 371, 470 371" stroke="#FF6B35" marker-end="url(#arrow-accent)"/>
  </g>

  <!-- Connector fan: stores -> grafana -->
  <g stroke="#4A5057" stroke-width="1.25" fill="none">
    <path d="M700 89  C 800 89,  800 230, 940 230" marker-end="url(#arrow)"/>
    <path d="M700 183 C 800 183, 800 230, 940 230" marker-end="url(#arrow)"/>
    <path d="M700 277 C 800 277, 800 230, 940 230" marker-end="url(#arrow)"/>
    <path d="M700 371 C 800 371, 800 230, 940 230" stroke="#FF6B35" marker-end="url(#arrow-accent)"/>
  </g>

  <!-- trace -> profile direct correlation -->
  <path d="M710 300 V 350" stroke="#FF6B35" stroke-width="1.25" stroke-dasharray="3 4" fill="none"/>
  <text x="718" y="330" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#FF9466">trace → profile</text>

  <!-- signal labels -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#8A8F98">
    <text x="350" y="130">metrics</text>
    <text x="306" y="196" font-size="11">structured logs · promtail</text>
    <text x="338" y="255">OTLP traces</text>
    <text x="312" y="320" fill="#FF9466">CPU / mem profiles</text>
  </g>

  <!-- Col 1: workloads (two independently-deployed sources, one shared telemetry destination) -->
  <g transform="translate(56,125)">
    <rect width="240" height="210" rx="12" fill="#14171A" stroke="#262B31" stroke-width="1.25"/>

    <circle cx="22" cy="30" r="4" fill="#F5F3EE"/>
    <text x="36" y="35" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="600" fill="#F5F3EE">backend + worker</text>
    <text x="22" y="58" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12.5" fill="#8A8F98">charts/hiresense</text>
    <text x="22" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#6B7280">internal/telemetry</text>

    <line x1="16" y1="100" x2="224" y2="100" stroke="#262B31" stroke-width="1"/>

    <circle cx="22" cy="122" r="4" fill="#F5F3EE"/>
    <text x="36" y="127" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="600" fill="#F5F3EE">recruiter-report</text>
    <text x="22" y="150" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12.5" fill="#8A8F98">charts/recruiter-report</text>
    <text x="22" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#6B7280">staging + prod</text>
    <text x="22" y="194" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#6B7280">own DB/TLS · shared stack</text>
  </g>

  <!-- Col 2: stores -->
  <g font-family="-apple-system,BlinkMacSystemFont,sans-serif">
    <g transform="translate(470,51)">
      <rect width="230" height="76" rx="12" fill="#14171A" stroke="#262B31" stroke-width="1.25"/>
      <text x="18" y="30" font-size="14.5" font-weight="600" fill="#F5F3EE">Prometheus</text>
      <text x="18" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#6B7280">metrics · :9090</text>
    </g>
    <g transform="translate(470,145)">
      <rect width="230" height="76" rx="12" fill="#14171A" stroke="#262B31" stroke-width="1.25"/>
      <text x="18" y="30" font-size="14.5" font-weight="600" fill="#F5F3EE">Loki</text>
      <text x="18" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#6B7280">logs · :3100</text>
    </g>
    <g transform="translate(470,239)">
      <rect width="230" height="76" rx="12" fill="#14171A" stroke="#262B31" stroke-width="1.25"/>
      <text x="18" y="30" font-size="14.5" font-weight="600" fill="#F5F3EE">Tempo</text>
      <text x="18" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#6B7280">traces · :4317 / :4318</text>
    </g>
    <g transform="translate(470,333)">
      <rect width="230" height="76" rx="12" fill="#1D1611" stroke="#FF6B35" stroke-opacity="0.5" stroke-width="1.25"/>
      <text x="18" y="30" font-size="14.5" font-weight="600" fill="#F5F3EE">Pyroscope</text>
      <text x="18" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#FF9466">profiles · :4040</text>
    </g>
  </g>

  <!-- Col 3: Grafana hub -->
  <g transform="translate(940,160)">
    <rect width="204" height="140" rx="12" fill="#14171A" stroke="#262B31" stroke-width="1.25"/>
    <circle cx="22" cy="30" r="4" fill="#FF6B35"/>
    <text x="36" y="35" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="600" fill="#F5F3EE">Grafana</text>
    <text x="22" y="66" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12.5" fill="#8A8F98">one pane of glass —</text>
    <text x="22" y="86" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12.5" fill="#8A8F98">metrics, logs, traces</text>
    <text x="22" y="106" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12.5" fill="#8A8F98">and flamegraphs, linked</text>
    <text x="22" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#6B7280">:3000</text>
  </g>
</svg>
